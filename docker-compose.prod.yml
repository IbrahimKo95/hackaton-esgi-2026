services:
  app:
    build:
      context: .
      target: prod
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      GROQ_API_KEY: ${GROQ_API_KEY}
    command: npm run start -- --hostname 0.0.0.0 --port 3000
    volumes: !reset []
